name: Release

# Tag-driven: `git tag v1.0.3 && git push origin v1.0.3` is the whole release process.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and history, so the changelog can be the commits since the last release.
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      # A tag that disagrees with gradle.properties would publish a jar whose own
      # metadata contradicts the release it is attached to, and Modrinth would take it.
      # Cheaper to stop here than to yank a version.
      - name: Check the tag against mod_version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match mod_version=$declared in gradle.properties"
            exit 1
          fi
          echo "releasing $declared"

      - name: Build and test
        run: ./gradlew build --stacktrace

      # The commits since the previous tag, or since the beginning for a first release.
      - name: Assemble the changelog
        run: |
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            range="$previous..${GITHUB_REF_NAME}"
            echo "changes since $previous"
          else
            range="${GITHUB_REF_NAME}"
            echo "first release: using the whole history"
          fi
          {
            echo 'CHANGELOG<<CHANGELOG_EOF'
            git log --no-merges --pretty=format:'- %s' "$range"
            echo
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_ENV"

      # Before Modrinth, and on purpose. This half depends on nothing outside the
      # repository, while a Modrinth upload can be refused for reasons that have nothing
      # to do with the build — a project still in review, a Minecraft version Modrinth
      # has not listed yet. Losing the GitHub release to one of those would be losing the
      # half that was never in doubt.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The mod jar only. build/libs also holds the sources jar, and a sources jar
          # dropped into a mods folder fails to load — not something to hand someone on
          # a release page next to the file they actually want.
          jar=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$')
          test -n "$jar" || { echo "no mod jar in build/libs" >&2; exit 1; }
          # Idempotent, so that re-running this job after a failed Modrinth upload does
          # not fall over on the release it already created.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; replacing its files"
            gh release upload "$GITHUB_REF_NAME" $jar --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "$CHANGELOG" \
              $jar
          fi

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinth --stacktrace
