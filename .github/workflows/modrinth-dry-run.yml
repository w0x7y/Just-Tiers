name: Modrinth dry run

# Manual only. Answers "would a release actually publish?" without publishing: Minotaur
# authenticates, looks the project up through the live API and assembles the entire
# payload, then prints it and stops short of creating the version.
#
# Worth running before the first tagged release, and after any change to the modrinth
# block — a release is the worst place to discover a bad token or a wrong project id.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: gradle/actions/wrapper-validation@v6.3.0

      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6.3.0

      # No extra verbosity needed: Minotaur prints the payload at lifecycle level, which
      # a default Gradle run already shows.
      - name: Assemble the version without uploading it
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinth -Pmodrinth_dry_run=true --stacktrace
