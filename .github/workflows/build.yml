name: Build

on:
  pull_request:
  push:
    branches: [main]
  # So a build can be re-run by hand after an outage at Mojang's or Fabric's maven,
  # without an empty commit to trigger one.
  workflow_dispatch:

# A force-push mid-build should not leave two runs racing for the same cache.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is a binary in the repository, and a build runs it. This is
      # cheap, and it is the one step that would catch it having been swapped.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      # Caches ~/.gradle, which for Loom includes the decompiled and remapped
      # Minecraft jar — several minutes of work that would otherwise repeat per run.
      - uses: gradle/actions/setup-gradle@v4

      # `build`, not `test`: it runs the tests and then compiles and remaps the jar, so
      # a change that breaks only the Minecraft-facing code — which no unit test can
      # reach — still fails here rather than at release.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: just-tiers-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      # Only when something failed: a green run's reports say nothing worth storing.
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: build/reports/tests/test
          if-no-files-found: ignore
