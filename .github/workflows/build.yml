name: Build

on:
  pull_request:
  push:
    branches: [main]
  # So a build can be re-run by hand after an outage at Mojang's or Fabric's maven,
  # without an empty commit to trigger one.
  workflow_dispatch:

# A force-push mid-build should not leave two runs racing for the same cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is a binary in the repository, and a build runs it. This is
      # cheap, and it is the one step that would catch it having been swapped.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      # Caches ~/.gradle, which for Loom includes the decompiled and remapped
      # Minecraft jar — several minutes of work that would otherwise repeat per run.
      - uses: gradle/actions/setup-gradle@v4

      # `build`, not `test`: it runs the tests and then packages the mod jar, so a
      # change that breaks only the Minecraft-facing code — which no unit test can
      # reach — still fails here rather than at release.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: just-tiers-${{ matrix.os }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      # Keep reports from both platforms so passed and failed assertions are reviewable.
      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 14
          if-no-files-found: ignore
