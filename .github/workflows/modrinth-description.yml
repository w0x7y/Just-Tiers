name: Sync Modrinth description

# Explicitly requested separately from publishing a version.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modrinth-description
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'
      - name: Validate the project copy and preview the gallery and release type
        run: |
          python3 tools/modrinth_project.py > /dev/null
          python3 tools/modrinth_project.py --gallery
          python3 tools/modrinth_project.py --release-type
      - name: Update the project summary, issues link and Markdown body
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/modrinth_project.py --apply
      - name: Replace the gallery with the listed images
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/modrinth_project.py --gallery --apply
      - name: Apply release_type to the current version's builds
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/modrinth_project.py --release-type --apply
