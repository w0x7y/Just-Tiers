name: Sync Modrinth description

# Explicitly requested separately from publishing a version.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modrinth-description
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Update the project description from the checked-out Markdown
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew modrinthSyncBody --stacktrace
